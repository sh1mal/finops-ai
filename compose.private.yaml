services:
  api:
    environment:
      FINOPS_SECURE_COOKIE: "1"
      FINOPS_OLLAMA_MODEL: "${FINOPS_OLLAMA_MODEL:-qwen3-vl:4b-instruct}"
      FINOPS_OLLAMA_URL: "${FINOPS_OLLAMA_URL:?Set the private Ollama URL}"
  web:
    ports: !reset []
  gateway:
    image: caddy:2-alpine
    environment:
      FINOPS_DEMO_HOST: "${FINOPS_DEMO_HOST:?Set the demo hostname}"
      FINOPS_DEMO_USER: "${FINOPS_DEMO_USER:?Set the demo username}"
      FINOPS_DEMO_PASSWORD_HASH: "${FINOPS_DEMO_PASSWORD_HASH:?Set the bcrypt password hash}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
    depends_on:
      - web
volumes:
  gateway-data:
